<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <!-- dá suporte aos caracteres especiais em portugues -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- WIDTH DEVICE
     informa ao navegador pra usar a largura real do dispositivo ao inves do padrão desktop -->
    <!-- INITIAL SCALE: tamanho inicial da pagina aberta pela primeira vez -->

    <title>Display Grid Revisão</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- o display grid NECESSITA DE UM ELEMENTO CONTAINER -->
      <header><h1>Header</h1></header>

      <div class="container2">
        <section id="esquerda">
          <nav><h2>Tag Nav</h2></nav>
          <aside><h2>Tag Aside</h2></aside>
        </section>

        <main>
          <section id="direita"><h2>Conteúdo principal</h2></section>
        </main>
      </div>

      <footer><h1>Rodapé</h1></footer>
    </div>
  </body>
</html>
