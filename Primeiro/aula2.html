<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 02 - CSS</title>
  </head>

  <!-- Estilos dentro do HTML -->
  <style>
    /* tag de estilos do CSS, fora do body */
    body {
      background-color: purple;
    }
    h1 {
      color: white; /*color sempre será cor de texto*/
      background-color: rgb(255, 157, 0);
      text-align: center;
    }
  </style>

  <body>
    <h1 style="color: blue" ;>Trabalhando com CSS</h1>
    <h1>Segundo Texto</h1>
    <h1>Terceiro Texto</h1>
    <p style="color: rgb(245, 245, 220)" ;>
      Lorem ipsum dolor sit, amet consectetur adipisicing elit. Assumenda, atque
      sit deserunt corporis commodi cumque non dolores tenetur recusandae
      reprehenderit veniam, fuga natus! Ipsam amet nulla tempore esse modi
      magni.
    </p>
  </body>
</html>
