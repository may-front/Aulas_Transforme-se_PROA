<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Listas no HTML</h1>
    <h2>Lista Não Ordenada</h2>
    <!-- lista não ordenada -->
    <ul>
      <li>Burnout Dominator</li>
      <li>Super Mario 64 DS</li>
      <li>Minecraft</li>
      <li>Legend Of Kay</li>
      <li>Castlevania: Symphony Of The Night</li>
    </ul>

    <h2>Lista Ordenada</h2>
    <ol type="I" start="4" reversed>
      <li>Banana</li>
      <li>Manga</li>
      <li>Goiaba</li>
      <li>Kiwi</li>
    </ol>
    <!-- parametros type, start e reversed -->
  </body>
</html>
