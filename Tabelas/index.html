<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabelas</title>

    <style>
      table,
      td {
        border: 1px solid #101010;
        border-collapse: collapse;
        font-size: 30px;
        background-color: rgb(255, 149, 149);
      }
    </style>
  </head>

  <body>
    <!-- cria uma tabela em HTML -->
    <!-- ESTRUTURA DE TABELA
     TR - Table Row - linha horizontal
     TH - Table Header - Coluna, header da tabela
     TD - Table Data - Informação -->
    <table>
      <tr>
        <!--linha horizontal -->
        <th>Produtos</th>
        <th>Preço</th>
        <!-- headers da tabela -->
      </tr>

      <tr>
        <td>Café</td>
        <td>R$199,99</td>
        <!-- dados da tabela -->
      </tr>

      <tr>
        <td>Arroz</td>
        <td>R$22,99</td>
        <!-- dados da tabela -->
      </tr>

      <tr>
        <td>Leite em Pó</td>
        <td>R$30,00</td>
      </tr>

      <tr>
        <td>Feijão 1kg</td>
        <td>R$9,00</td>
      </tr>
    </table>
  </body>
</html>
