<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Display Grid II</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header><h1>Header</h1></header>
      <nav><h2>Nav</h2></nav>

      <main>
        <div class="container2">
          <div id="lateral">
            <h2>Div-lateral</h2>
            <figure>
              <img
                src="https://minecraft.wiki/images/Creeper_Head_%28S%29_JE1.png?14d9d"
                alt="Uma cabeça de creeper (criatura quadrada e verde)do minecraft"
              />
            </figure>
          </div>

          <section><h2>Section</h2></section>
          <aside>
            <h2>Aside</h2>
            <figure>
              <img
                src="https://mcheads.ru/heads/medium/front/ejon.png"
                alt="cabeça do Herobrine (Humano, cabeça quadrada sem olhos) do Minecraft"
              />
            </figure>
          </aside>
        </div>
      </main>

      <footer><h2>Footer</h2></footer>
    </div>
  </body>
</html>
